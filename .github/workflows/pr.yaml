---
    name: "PR workflow"

    on:
      pull_request:
        types:
          - opened
          - synchronize
          - reopened
          - ready_for_review
        paths-ignore:
          - 'static/**'
          - '**.md'
          - '.gitignore'
          - '.github/ISSUE_TEMPLATE/**'
      workflow_dispatch:
        inputs:
          logLevel:
            description: 'Log level'
            required: true
            default: 'warning'

    env:
      DANDANAPI_APPID: ${{ secrets.DANDANAPI_APPID }}
      DANDANAPI_KEY: ${{ secrets.DANDANAPI_KEY }}
      KAZUMI_APPID: ${{ secrets.KAZUMI_APPID }}
      KAZUMI_KEY: ${{ secrets.KAZUMI_KEY }}

    jobs:
      flutter-test:
        if: ${{ github.event_name == 'workflow_dispatch' || ! github.event.pull_request.draft }}
        runs-on: "ubuntu-latest"
        permissions:
          contents: read
        steps:
          - name: Clone repository
            uses: actions/checkout@v4
          - name: Set up Flutter
            uses: subosito/flutter-action@v2.16.0
            with:
              channel: stable
              flutter-version-file: pubspec.yaml
          - name: Get Flutter dependencies
            run: flutter pub get
            shell: bash
          - name: Run Flutter tests
            run: flutter test
            shell: bash

      flutter-analyze:
        if: ${{ github.event_name == 'workflow_dispatch' || ! github.event.pull_request.draft }}
        runs-on: "ubuntu-latest"
        permissions:
          contents: read
        steps:
          - name: Clone repository
            uses: actions/checkout@v4
          - name: Set up Flutter
            uses: subosito/flutter-action@v2.16.0
            with:
              channel: stable
              flutter-version-file: pubspec.yaml
          - name: Get Flutter dependencies
            run: flutter pub get
            shell: bash
          - name: Analyze Flutter project
            run: flutter analyze --no-fatal-infos --fatal-warnings
            shell: bash

      flutter-build-ios:
        needs: [flutter-test, flutter-analyze]
        if: ${{ github.event_name == 'workflow_dispatch' || ! github.event.pull_request.draft }}
        name: "Build iOS ipa"
        runs-on: "macos-26"
        permissions:
          contents: write
        steps:
          - name: Clone repository
            uses: actions/checkout@v4
          - name: Set up Flutter
            uses: subosito/flutter-action@v2.16.0
            with:
              channel: stable
              flutter-version-file: pubspec.yaml
          - name: Get Flutter dependencies
            run: flutter pub get
          - name: Build IPA
            run: >-
              flutter build ios --release --no-codesign
              --dart-define=DANDANAPI_APPID=$DANDANAPI_APPID
              --dart-define=DANDANAPI_KEY=$DANDANAPI_KEY
              --dart-define=KAZUMI_APPID=$KAZUMI_APPID
              --dart-define=KAZUMI_KEY=$KAZUMI_KEY
          - name: Create IPA
            run: |
              VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
              SHA=$(git rev-parse --short HEAD)
              mkdir Payload
              cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
              find Payload/Runner.app/Frameworks -type d -name "*.framework" -exec codesign --force --sign - --preserve-metadata=identifier,entitlements {} \;
              zip -q -r "Kazumi_ios_${VERSION}_${SHA}_no_sign.ipa" Payload
              ls -l Kazumi_ios_*.ipa
          - name: Upload iOS build
            uses: actions/upload-artifact@v4
            with:
              name: ios_outputs
              path: Kazumi_ios_*.ipa
          # Actions artifact 的下载永远是 zip（这是 GitHub 平台行为，工作流改不了）。
          # 想要「点开就是 .ipa」就同时挂一份到 Release：release 文件不做二次打包，
          # 链接直接以 .ipa 结尾，SideStore / AltStore 也能直接吃这个 URL。
          - name: Publish ipa to rolling pre-release
            if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
            env:
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            run: |
              TAG="ci-latest"
              IPA=$(ls Kazumi_ios_*.ipa | head -n1)
              if gh release view "$TAG" >/dev/null 2>&1; then
                for asset in $(gh release view "$TAG" --json assets -q '.assets[].name'); do
                  gh release delete-asset "$TAG" "$asset" -y || true
                done
              else
                gh release create "$TAG" \
                  --target "$GITHUB_SHA" \
                  --title "CI 自动构建（最新一次）" \
                  --notes "PR 工作流每次推送自动覆盖。未签名 ipa，需侧载。" \
                  --prerelease
              fi
              gh release upload "$TAG" "$IPA" --clobber
              echo "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$IPA"
            shell: bash
