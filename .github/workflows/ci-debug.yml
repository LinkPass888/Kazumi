---
name: "CI Debug"

# 临时工作流：把 analyze / test 的输出通过 PR 评论回传，便于本地读取
on:
  push:
    branches:
      - 'feat/**'

jobs:
  debug-checks:
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
      - name: Get Flutter dependencies
        run: flutter pub get
        shell: bash
      - name: Run checks
        run: |
          set +e
          flutter analyze --no-fatal-infos > /tmp/analyze.log 2>&1
          echo "analyze exit: $?" >> /tmp/analyze.log
          flutter test > /tmp/test.log 2>&1
          echo "test exit: $?" >> /tmp/test.log
          tail -n 40 /tmp/analyze.log
          tail -n 40 /tmp/test.log
        shell: bash
      - name: Post results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/ci-debug/post.py
        shell: bash
